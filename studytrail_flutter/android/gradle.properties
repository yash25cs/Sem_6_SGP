# The Gradle daemon and the Kotlin daemon are separate JVMs, and the Kotlin
# Gradle plugin reuses org.gradle.jvmargs for its own daemon unless
# kotlin.daemon.jvmargs is set. The previous -Xmx8G -XX:MaxMetaspaceSize=4G
# therefore reserved ~12G twice on a 16G machine whose pagefile sits on a full
# C:, and the daemon died with "Native memory allocation (malloc) failed".
# Debug builds do not need large heaps: no R8, no minification.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m

# This machine reports 16 cores, so Gradle would otherwise run 16 worker actions
# at once, each with its own buffers and temp files. Peak memory and free disk
# are the scarce resources here, not CPU.
org.gradle.workers.max=4

# The pub cache is on C: while this project is on D:. Kotlin's relocatable
# incremental caches call File.relativeTo() across those two roots, which throws
# "this and base files have different roots" and fails compileDebugKotlin for
# every plugin module (url_launcher_android, file_picker, shared_preferences_android).
# Plugin Kotlin is a handful of files that rarely change, so compiling it
# non-incrementally costs very little.
kotlin.incremental=false

android.useAndroidX=true

# Artifact downloads from dl.google.com time out on this network with the JVM's
# 30s defaults (curl on the same URL connects fine but transfers slowly), so
# give Gradle 3 minutes per read and prefer IPv4.
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
