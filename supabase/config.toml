# Supabase project ID (local ref). Rename freely; `supabase link` binds this
# folder to your hosted project by its ref, independent of this value.
project_id = "studytrail"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 25 MiB — comfortably covers a syllabus PDF.
file_size_limit = "25MiB"

[auth]
enabled = true
# The app's deep-link scheme + localhost for dev. Add your device/site URL here.
site_url = "in.charusat.studytrail://login-callback"
additional_redirect_urls = ["in.charusat.studytrail://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Dev: skip the email round-trip so signups log in immediately. Turn ON for prod.
enable_confirmations = false

# Google OAuth. Secrets are read from env at `supabase start` / dashboard.
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[edge_runtime]
enabled = true
# Deno functions call Gemini; keep the key as a secret, never in code.
policy = "oneshot"

[analytics]
enabled = false
